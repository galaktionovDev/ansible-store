- hosts: all
  gather_facts: false
  tasks:
    - import_role:
        name: configure-load-vars
    - include_role:
        name: docker-setup
    - include_role:
        name: nginx-docker
  vars:
    distrib_store: "{{ _REPOS.distrib_store }}"
    docker_registry: "{{ _REPOS.docker_registry }}"
    docker_image_path: "{{ _REPOS.docker_image_path }}"
