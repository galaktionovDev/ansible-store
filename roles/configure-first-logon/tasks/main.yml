---
- name: Wait server availability
  wait_for_connection:
    connect_timeout: 5
    delay: 0
    sleep: 5
    timeout: 600

- setup:

- name: Check actual hostname on vm
  ansible.builtin.command: hostname
  register: hostname_check
  changed_when: false

- name: Fail if hostname does not match inventory
  ansible.builtin.fail:
    msg: >-
      Hostname mismatch detected for IP '{{ ansible_host }}'.
      Inventory expects '{{ inventory_hostname }}', but the machine
      answering on this IP identifies itself as
      '{{ hostname_check.stdout }}'.

      Possible cause: IP '{{ ansible_host }}' was previously assigned to
      VM '{{ hostname_check.stdout }}', which may still be running
      or not fully deprovisioned.
  when: not (hostname_check.stdout == inventory_hostname or hostname_check.stdout.startswith(inventory_hostname + '.'))

- name: Put cloud public key file
  authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ public_key }}"
    exclusive: true

- name: Disable password authentication
  user:
    name: "{{ ansible_user }}"
    password: "{{ blank_password }}"

- name: Disable cloud-init after first boot
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
  ignore_errors: yes
  