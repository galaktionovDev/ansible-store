---

- name: Gather network facts only
  ansible.builtin.setup:
    gather_subset: network

- name: Check if node_exporter service is running
  ansible.builtin.systemd:
    name: node_exporter
    state: started
  register: node_exporter_status
  ignore_errors: yes

- name: Print node_exporter_status
  debug:
    var: node_exporter_status

- block:
    - include_tasks: configure-node-exporter.yml
  when: node_exporter_status.changed or node_exporter_status.failed

- name: Set stats with node_exporter target as a list
  set_stats:
    data:
      node_exporter_target: "{{ (node_exporter_target | default([])) + [ansible_default_ipv4.address + ':9100'] | unique }}"

