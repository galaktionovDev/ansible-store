- name: "set_repositories | add required repo from set_repositories_repo_keys using copy"
  block:

    - name: "Comment out all lines in sources.list"
      replace:
        path: "/etc/apt/sources.list"
        regexp: '^(.*)$'
        replace: '#\1'
      ignore_errors: yes

    - name: "Add repository to {{ item.name }} copy"
      copy:
        dest: "/etc/apt/sources.list.d/{{ item.name }}.list"
        content: "{{ item.repo_string }}"
        owner: "root"
        group: "root"
        mode: "0644"
      when:
        - item.name is defined
        - item.repo_string is defined
      loop: "{{ set_repositories_required_repo.apt }}"
      loop_control:
        label: "{{ item.name }}"
    
    - name: Update apt cache
      command: apt-get update
      ignore_errors: true  # Ignoring errors if there's no internet
  # when: ansible_distribution.split(' ') | first | lower in ['astra']

