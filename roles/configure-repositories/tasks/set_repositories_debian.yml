---

- name: "set_repositories | check if apt-key is available"
  command: which apt-key
  register: apt_key_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "set_repositories | add trust to repos with apt-key"
  apt_key:
    url: "{{ item.key_url | default(omit) }}"
    state: present
    keyring: /etc/apt/trusted.gpg.d/{{ item.name }}.gpg
    data: "{{ item.data | default(omit) }}"
    validate_certs: false
  when:
    - item.name is defined
    - item.key_url is defined or item.data is defined
    - apt_key_check.rc == 0
  loop: "{{ set_repositories_repo_keys.apt }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true  # Ignoring errors if there's no internet


- name: "set_repositories | add trust to repos without apt-key"
  shell: |
    wget -qO- "{{ item.key_url }}" | gpg --dearmor > "/etc/apt/trusted.gpg.d/{{ item.name }}.gpg"
  when:
    - item.name is defined
    - item.key_url is defined
    - apt_key_check.rc != 0
  loop: "{{ set_repositories_repo_keys.apt }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true


