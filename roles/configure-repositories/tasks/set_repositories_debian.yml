---

- name: "set_repositories | add trust to repos from set_repositories_required_repo variable"
  apt_key:
    url: "{{ item.key_url | default(omit) }}"
    state: present
    data: "{{ item.data | default(omit) }}"
    validate_certs: false
  when:
    - item.name is defined
    - item.key_url is defined or item.data is defined
  loop: "{{ set_repositories_repo_keys.apt }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: true  # Ignoring errors if there's no internet

