---

app_name: "kafka"
ansible_become: true
kafka_port: "9092"
kafka_controller_port: "9093"
kafka_cloud_container_name: "cloudbox-{{ app_name }}"
kafka_version: "3.4.0"
app_volume_prefix: "cloud"
app_data_volume_name: "{{ app_volume_prefix }}-{{ app_name }}-data"
app_config_volume_name: "{{ app_volume_prefix }}-{{ app_name }}-config"
app_user_config_volume_name: "{{ app_volume_prefix }}-{{ app_name }}-user-config"
container_data_path: "/opt/bitnami/kafka/data"
container_config_path: "/opt/bitnami/kafka/config"
container_user_config_path: "/bitnami/kafka/config"
kafka_auto_create_topics: false
