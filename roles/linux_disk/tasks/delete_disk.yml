---
- name: Check contract
  fail:
    msg: "delete_disk: требуется deleted_disk_uuid или deleted_disk_path"
  when: >-
    (deleted_disk_uuid is not defined or not deleted_disk_uuid) and
    (deleted_disk_path is not defined or not deleted_disk_path)

- name: Resolve device of deleted disk
  set_fact:
    dd_device: >-
      {%- set id_prefixes = ['scsi0qemuqemuharddisk', 'scsi3', 'virtio', 'scsi', 'ata', 'wwn0x', 'wwn', 'nvmeeui'] -%}
      {%- set found = namespace(dev='') -%}
      {%- set nuuid = (deleted_disk_uuid | default('')) | replace('-', '') | replace('_', '') | lower -%}
      {%- if nuuid -%}
        {%- for dev_name, dev_params in disk_devices | dictsort if dev_name != boot_disk_name and not found.dev -%}
          {%- set dev_ids = (dev_params.links.ids | default([])) + ([dev_params.serial] if (dev_params.serial is defined and dev_params.serial) else []) -%}
          {%- for id in dev_ids if not found.dev -%}
            {%- set nid_full = id | replace('-', '') | replace('_', '') | lower -%}
            {%- set nid = namespace(v=nid_full) -%}
            {%- set stripped = namespace(done=false) -%}
            {%- for p in id_prefixes if not stripped.done -%}
              {%- if nid.v.startswith(p) -%}
                {%- set nid.v = nid.v[p | length:] -%}
                {%- set stripped.done = true -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if (nuuid in nid_full) or (nid.v | length >= 8 and nid.v in nuuid) -%}
              {%- set found.dev = dev_name -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endif -%}
      {%- if not found.dev and deleted_disk_path is defined and deleted_disk_path -%}
        {%- set p = deleted_disk_path.split('/') | last -%}
        {%- if p in disk_devices -%}{%- set found.dev = p -%}{%- endif -%}
      {%- endif -%}
      {{ found.dev }}

- name: Print resolved device of deleted disk
  debug:
    var: dd_device

- name: Require selected device to remain attached
  ansible.builtin.assert:
    that:
      - dd_device | length > 0
      - dd_device != boot_disk_name
    fail_msg: >-
      Selected disk is not visible to the guest. Refusing cleanup before platform detach.

- name: Find volume group on selected physical volume
  ansible.builtin.command:
    argv: [pvs, --noheadings, -o, vg_name, "/dev/{{ dd_device }}"]
  register: dd_vg_query
  changed_when: false
  failed_when: false

- name: Save selected volume group
  ansible.builtin.set_fact:
    dd_vg_name: "{{ dd_vg_query.stdout | trim if dd_vg_query.rc == 0 else '' }}"

- name: Reject unexpected partitioned disk without directly detected PV
  ansible.builtin.assert:
    that:
      - disk_devices[dd_device].partitions | default({}) | length == 0
    fail_msg: >-
      Partitioned disk or partition-level PV detected. Automatic removal is not supported.
  when: dd_vg_name | length == 0

- name: Check for directly mounted filesystems on selected disk
  ansible.builtin.assert:
    that:
      - >-
        (ansible_mounts |
         selectattr('device', 'match', '^/dev/' ~ dd_device ~ '([0-9]+)?$') |
         list | length) == 0
    fail_msg: >-
      Selected disk has a directly mounted filesystem. Refusing detach.

- name: Inspect selected VG before cleanup
  when: dd_vg_name | length > 0
  block:
    - name: Read VG physical volumes
      ansible.builtin.command:
        argv: [pvs, --noheadings, -o, pv_name, --select, "vg_name={{ dd_vg_name }}"]
      register: dd_vg_pv_query
      changed_when: false

    - name: Build VG physical volume list
      ansible.builtin.set_fact:
        dd_vg_pv_list: >-
          {{ dd_vg_pv_query.stdout_lines | map('trim')
             | reject('equalto', '') | list }}

    - name: Read used capacity on selected PV
      ansible.builtin.command:
        argv: [pvs, --noheadings, --nosuffix, -o, pv_used, "/dev/{{ dd_device }}"]
      register: dd_pv_used
      changed_when: false

    - name: Verify VG ownership and PV membership
      ansible.builtin.assert:
        that:
          - dd_vg_name is match('^vg_')
          - dd_vg_name != root_vg_name
          - dd_vg_pv_list | length > 0
          - "'/dev/' ~ dd_device in dd_vg_pv_list"
        fail_msg: >-
          The selected PV does not belong to a supported application VG.

    - name: Reject a used PV in a multi-PV VG
      ansible.builtin.assert:
        that:
          - (dd_pv_used.stdout | trim | float) == 0
        fail_msg: >-
          VG spans multiple PVs and selected PV contains allocated extents.
          Remove or migrate the LVs explicitly before deleting this disk.
      when: dd_vg_pv_list | length > 1

    - name: Remove dedicated VG with its file systems
      when: dd_vg_pv_list | length == 1
      block:
        - name: Find mounted logical volumes of the dedicated VG
          ansible.builtin.set_fact:
            dd_mounts_to_remove: >-
              {{ (ansible_mounts |
                   selectattr('device', 'match', '^/dev/mapper/' ~ dd_vg_name ~ '-') |
                   list)
                 + (ansible_mounts |
                    selectattr('device', 'match', '^/dev/' ~ dd_vg_name ~ '/') |
                    list) }}

        - name: Unmount application filesystems and remove their fstab entries
          ansible.posix.mount:
            path: "{{ item.mount }}"
            state: absent
          loop: "{{ dd_mounts_to_remove }}"
          loop_control:
            label: "{{ item.mount }}"

        - name: Refresh mount facts before VG removal
          ansible.builtin.setup:
            gather_subset: hardware

        - name: Ensure that no filesystems from dedicated VG remain mounted
          ansible.builtin.assert:
            that:
              - >-
                (ansible_mounts |
                 selectattr('device', 'match', '^/dev/mapper/' ~ dd_vg_name ~ '-') |
                 list | length) == 0
              - >-
                (ansible_mounts |
                 selectattr('device', 'match', '^/dev/' ~ dd_vg_name ~ '/') |
                 list | length) == 0
            fail_msg: >-
              Dedicated VG still has mounted file systems.

        - name: Remove dedicated VG and logical volumes
          ansible.builtin.command:
            argv: [vgremove, -f, "{{ dd_vg_name }}"]
          notify: update_facts

    - name: Release empty PV from multi-PV VG
      ansible.builtin.command:
        argv: [vgreduce, "{{ dd_vg_name }}", "/dev/{{ dd_device }}"]
      when: dd_vg_pv_list | length > 1
      notify: update_facts

    - name: Remove remaining orphan PV label
      ansible.builtin.command:
        argv: [pvremove, -ff, -y, "/dev/{{ dd_device }}"]
      register: dd_pvremove
      changed_when: dd_pvremove.rc == 0
      failed_when: false
      when: delete_disk_wipe | default(true)

- name: Erase residual signatures only after successful LVM cleanup
  ansible.builtin.command:
    argv: [wipefs, -a, "/dev/{{ dd_device }}"]
  when: delete_disk_wipe | default(true)
  notify: update_facts

- meta: flush_handlers

- name: Detach deleted block device from kernel
  shell: |
    dev="{{ dd_device }}"
    if [ -n "$dev" ] && [ -e "/sys/block/$dev/device/delete" ]; then
      echo 1 > "/sys/block/$dev/device/delete"
    fi
    for h in /sys/class/scsi_host/host*/scan; do [ -e "$h" ] && echo "- - -" > "$h"; done
    [ -e /sys/bus/pci/rescan ] && echo 1 > /sys/bus/pci/rescan
    command -v udevadm >/dev/null && udevadm settle || true
  changed_when: false

- name: Gather facts after detach
  ansible.builtin.setup:
    gather_subset: hardware

- include_tasks: per_disk_match.yml
- include_tasks: per_disk_report.yml