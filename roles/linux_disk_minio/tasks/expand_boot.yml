- block:

  - name: Re-scan disk size
    shell:
      _raw_params: "echo 1 > /sys/block/{{ boot_disk_name }}/device/rescan"
    ignore_errors: yes

  - name: Determine partition table type
    command: parted /dev/{{ boot_disk_name }} --script print
    register: parted_output
    ignore_errors: yes

  - name: Check if partition table is MBR
    set_fact:
      is_mbr: "{{ 'msdos' in parted_output.stdout }}"
    ignore_errors: yes


  - name: Print is_mbr
    debug:
      var: is_mbr

#  - name: Print root_lv_name
#    debug:
#      var: /dev/{{ boot_disk_name }}

  - name: Find extended partition
    shell: parted /dev/{{ boot_disk_name }} print | grep 'extended' | awk '{print $1}'
    register: extended_partition
    when: is_mbr
    ignore_errors: yes
#  - name: Find extended partition
#    shell: lsblk -ln -o NAME,TYPE /dev/vda | grep 'extended' | awk '{print $1}'
#    register: extended_partition
#    when: is_mbr
#    ignore_errors: yes

  - name: Check if extended partition exists
    set_fact:
      extended_exists: "{{ extended_partition.stdout | trim != '' }}"
    ignore_errors: yes

  - name: Print extended_partition
    debug:
      var:  extended_partition.stdout | trim

  - name: Resize extended partition
    command: parted /dev/{{ boot_disk_name }} resizepart "{{ extended_partition.stdout | trim | int }}" 100%
    when: extended_exists
    ignore_errors: yes


  - name: Расширить GPT таблицу разделов для использования всего дискового пространства
    ansible.builtin.command:
      cmd: "sgdisk -e /dev/{{ boot_disk_name }}"
    when: not is_mbr
    ignore_errors: yes


