- name: Update YUM cache for specific repos
  yum:
    update_cache: yes
    disablerepo: '*'
    enablerepo: "{{ item.name }}"
  when:
    - item.name is defined
    - (ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux'])
  ignore_errors: yes
  loop: "{{ selected_repositories }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install cloud-utils-growpart using dnf
  dnf:
    name:
      - cloud-utils-growpart
    state: latest
    enablerepo: "cld-repository-el{{ ansible_distribution_major_version }}"
    disablerepo: "*"
  when: (ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'oraclelinux'])
  ignore_errors: yes

- name: Install cloud-utils-growpart using dnf
  dnf:
    name:
      - gdisk
    state: latest
    enablerepo: "cld-repository-el{{ ansible_distribution_major_version }}"
    disablerepo: "*"
  when: (ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'oraclelinux'])
  ignore_errors: yes

