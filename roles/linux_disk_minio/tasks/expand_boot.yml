#"""
#parted и growpart для того, чтобы расширить диск до 100%
#pvresize и lvol для LVM
#resize2fs, если нет LVM
#sgdisk, если нужно расширить таблицу разделов
#"""

- name: Display ansible_distribution_major_version
  debug:
    msg: "ansible_distribution_major_version is {{ ansible_distribution_major_version }}"
  when: (ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux'])

- name: Determine the appropriate repo list
  set_fact:
    selected_repositories: "{{ set_repositories_required_repo.yum['el' + ansible_distribution_major_version] }}"
  when: (ansible_distribution.split(' ') | first | lower in ['red', 'almalinux', 'centos', 'oraclelinux'])

- name: Gathering facts
  setup:

- name: Print boot_disk_name
  debug:
    var: boot_disk_name

- name: Print device name
  debug:
    var: disk_devices

- name: Print root_device_name
  debug:
    var: root_device_name

- name: Print root_partition_name
  debug:
    var: root_partition_name

- name: Print root_vg_name
  debug:
    var: root_vg_name

- name: Print root_lv_name
  debug:
    var: root_lv_name

- name: Check LVM physical volume status for /dev/sda
  ansible.builtin.shell: pvs --noheadings -o pv_name | grep '/dev/{{ boot_disk_name }}'
  register: pvs_check
  ignore_errors: yes

- name: Determine if /dev/sda is a physical volume
  set_fact:
    boot_is_pv: "{{ pvs_check.rc == 0 }}"

- name: Print root_lv_name
  debug:
    var: boot_is_pv


# Установка пакетов APT
- name: "Install Docker for Astra"
  block:
    - name: Update apt cache
      command: apt-get update

    - name: "Install components using apt-get command"
      command: apt-get install -y --allow-unauthenticated cloud-utils gdisk parted
  when: ansible_distribution.split(' ') | first | lower in ['ubuntu', 'astra', 'debian']
  ignore_errors: true
