---

ansible_become: true

# База для номера таблицы маршрутизации, если у NIC нет vSphere-uuid.
# По умолчанию таблица берётся из new_nic.uuid (ключ адаптера vSphere: 4001, 4002 и т.д.),
# что делает нумерацию стабильной и безопасной при будущем delete_nic.
extra_nic_table_base: 100

# Диспетчер интерфейсов роли.
allowed_interfaces:
  - add_nic
  # - delete_nic
