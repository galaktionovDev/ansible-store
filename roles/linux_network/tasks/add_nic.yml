---

- name: Идентификация целевого интерфейса
  ansible.builtin.include_tasks: identify_nic.yml

- name: Настройка через netplan
  ansible.builtin.include_tasks: configure_netplan.yml
  when: network_backend == 'netplan'

- name: Настройка через nmcli
  ansible.builtin.include_tasks: configure_nmcli.yml
  when: network_backend == 'nmcli'

- name: Перечитать факты для чтения MAC применённого интерфейса
  ansible.builtin.setup:
    gather_subset: network

- name: Итоговый MAC
  ansible.builtin.set_fact:
    nic_mac_final: >-
      {{ new_nic.mac_address
         if (new_nic.mac_address | default('') | length > 0)
         else (ansible_facts[target_iface].macaddress | default('')) }}

- name: Сборка объекта NIC в структуре default_nic
  ansible.builtin.set_fact:
    _result_nic: "{{ new_nic | combine({'mac_address': nic_mac_final}) }}"

- name: Обновлённый список extra_nics
  ansible.builtin.set_fact:
    _extra_nics_out: "{{ (extra_nics[:-1] if (extra_nics | default([])) | length > 0 else []) + [_result_nic] }}"

- name: Возврат данных в граф
  ansible.builtin.set_stats:
    data:
      nic_devices_data:
        extra_nics: "{{ _extra_nics_out }}"
        os_ifname: "{{ target_iface }}"
