---

- name: Start a mongo container with {{ mongo_port }} port exposed
  raw: "docker run -d --restart=always --name {{ mongo_cloud_container_name }}  -e MONGO_INITDB_ROOT_USERNAME={{ mongo_root_username }} -e MONGO_INITDB_ROOT_PASSWORD={{ mongo_root_password }} -v {{ app_data_volume_name }}:{{ container_data_path }} -v {{ app_config_volume_name }}:{{ container_config_path }} -p {{ mongo_port }}:{{ mongo_port }} {{ nexus_docker_url }}/mongo:{{ mongo_version }}"

- set_stats:
    data:
      connection_url: "{{ 'mongodb://' + machine['default_v4_address'] + ':' + mongo_port }}"