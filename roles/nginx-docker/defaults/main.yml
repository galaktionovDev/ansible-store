---

app_name: "nginx"
ansible_become: true
distrib_version: "1.0"
distrib_name: "nginx-docker-image"
archive_ext: "tar"
docker_path: "/tmp/docker-images"
app_volume_prefix: "cloud"
app_data_volume_name: "{{ app_volume_prefix }}-{{ app_name }}-data"
app_config_volume_name: "{{ app_volume_prefix }}-{{ app_name }}-config"
container_data_path: "/usr/share/nginx/html"
container_config_path: "/etc/nginx"