- name: Insert the new configuration block
  blockinfile:
    path: "{{ odyssey_config_path }}"
    block: |
      database "{{ databasename }}" {
        user "{{ username }}" {
          authentication "md5"
          password "{{ user_password }}"
          storage "postgres_server"
          pool "{{ 'session' if rolename == 'read' else 'transaction' }}"
          log_debug yes
          log_query yes
        }
      }
    marker: "# {mark} ANSIBLE MANAGED BLOCK for {{ username }} in {{ databasename }}"
    insertafter: EOF
    backup: yes
  notify: restart odyssey


- set_stats:
    data:
      db_roles:
        username: "{{ username }}"
        rolename: "{{ rolename }}"
        databasename: "{{ databasename }}"