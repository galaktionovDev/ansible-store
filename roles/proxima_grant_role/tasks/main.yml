- name: Revoke all roles before grant
  postgresql_query:
    login_db: "{{ databasename }}"
    login_host: "{{ keepalived_address }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_password }}"
    query: "REVOKE ALL ON DATABASE {{ databasename }} FROM {{ username }};"
  run_once: true

- name: Revoke all privileges from all tables and sequences in the public schema
  postgresql_query:
    login_db: "{{ databasename }}"
    login_host: "{{ keepalived_address }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_password }}"
    query: |
      REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM {{ username }};
      REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public FROM {{ username }};
      REVOKE ALL ON SCHEMA public FROM {{ username }} CASCADE;
  run_once: true

