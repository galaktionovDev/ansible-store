- name: Grant role on database for read only users
  postgresql_query:
    login_db: "{{ databasename }}"
    login_host: "{{ keepalived_address }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_password }}"
    query: "GRANT pg_read_all_data TO {{ username }};"
  run_once: true
#  when: rolename | lower == 'read'

