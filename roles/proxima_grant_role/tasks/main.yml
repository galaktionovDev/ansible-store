- name: Grant full access on schema for read/write users
  postgresql_query:
    login_db: "{{ databasename }}"
    login_host: "{{ keepalived_address }}"
    login_port: "{{ postgres_port }}"
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_password }}"
    query: "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ username }}; GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO {{ username }}; GRANT USAGE, CREATE ON SCHEMA public TO {{ username }};"
  run_once: true
  when: rolename | lower == 'read/write'

